name: Apply UI fixes

on:
  push:
    branches:
      - fix/csp-local-auth
    paths:
      - .github/workflows/temp-apply-ui-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/csp-local-auth

      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8-sig")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrences, found {actual}: {old[:80]!r}")
              text = text.replace(old, new)
              p.write_text(text, encoding="utf-8")

          # Mobile gallery: commit target index at transition start and keep the incoming
          # slide in its off-screen start pose before CSS animation is applied.
          mobile = "src/components/services/OrmedBookSliderMobile.jsx"
          replace_exact(
              mobile,
              '''    setTransition({\n      fromIndex: currentIndex,\n      toIndex,\n      direction,\n    });''',
              '''    const fromIndex = currentIndex;\n\n    setCurrentIndex(toIndex);\n    setTransition({\n      fromIndex,\n      toIndex,\n      direction,\n    });'''
          )
          replace_exact(
              mobile,
              '''  const finishTransition = () => {\n    if (!transition) {\n      return;\n    }\n\n    setCurrentIndex(transition.toIndex);\n    setTransition(null);\n  };''',
              '''  const finishTransition = () => {\n    if (!transition) {\n      return;\n    }\n\n    setTransition(null);\n  };'''
          )
          replace_exact(
              mobile,
              '''} ${SLIDE_DURATION}ms cubic-bezier(0.22, 1, 0.36, 1) forwards`,''',
              '''} ${SLIDE_DURATION}ms cubic-bezier(0.22, 1, 0.36, 1) both`,''',
              count=2
          )
          replace_exact(
              mobile,
              '''                  style={{\n                    animation: `${''',
              '''                  style={{\n                    transform: isNextDirection\n                      ? "translate3d(100%, 0, 0) scale(0.985)"\n                      : "translate3d(-100%, 0, 0) scale(0.985)",\n                    opacity: 0.72,\n                    animation: `${'''
          )
          replace_exact(
              mobile,
              '''                  onAnimationEnd={finishTransition}''',
              '''                  onAnimationEnd={(event) => {\n                    if (event.currentTarget === event.target) {\n                      finishTransition();\n                    }\n                  }}'''
          )

          # Tablet gallery: same atomic transition and pre-animation start pose.
          tablet = "src/components/services/OrmedBookSliderTablet.jsx"
          replace_exact(
              tablet,
              '''    setTransition({\n      fromIndex: currentIndex,\n      toIndex,\n      direction,\n    });''',
              '''    const fromIndex = currentIndex;\n\n    setCurrentIndex(toIndex);\n    setTransition({\n      fromIndex,\n      toIndex,\n      direction,\n    });'''
          )
          replace_exact(
              tablet,
              '''  const finishTransition = () => {\n    if (!transition) {\n      return;\n    }\n\n    setCurrentIndex(transition.toIndex);\n    setTransition(null);\n  };''',
              '''  const finishTransition = () => {\n    if (!transition) {\n      return;\n    }\n\n    setTransition(null);\n  };'''
          )
          replace_exact(
              tablet,
              '''} ${SLIDE_DURATION}ms cubic-bezier(0.22, 1, 0.36, 1) forwards`,''',
              '''} ${SLIDE_DURATION}ms cubic-bezier(0.22, 1, 0.36, 1) both`,''',
              count=2
          )
          replace_exact(
              tablet,
              '''                  style={{\n                    animation: `${''',
              '''                  style={{\n                    transform: isNextDirection\n                      ? "translate3d(100%, 0, 0) scale(0.99)"\n                      : "translate3d(-100%, 0, 0) scale(0.99)",\n                    opacity: 0.76,\n                    animation: `${'''
          )
          replace_exact(
              tablet,
              '''                  onAnimationEnd={finishTransition}''',
              '''                  onAnimationEnd={(event) => {\n                    if (event.currentTarget === event.target) {\n                      finishTransition();\n                    }\n                  }}'''
          )

          # Desktop book: keep the source spread underneath until one painted frame of
          # the turning mesh has elapsed. This prevents a target-page flash before the
          # old page covers it.
          desktop = "src/components/services/OrmedBookSlider.jsx"
          replace_exact(
              desktop,
              '''  const nextTurnFrameRef = useRef(null);\n\n  const settleHoldTimeoutRef''',
              '''  const nextTurnFrameRef = useRef(null);\n  const underlayFrameRef = useRef(null);\n\n  const settleHoldTimeoutRef'''
          )
          replace_exact(
              desktop,
              '''      if (nextTurnFrameRef.current) {\n        cancelAnimationFrame(nextTurnFrameRef.current);\n      }\n\n      if (settleHoldTimeoutRef.current)''',
              '''      if (nextTurnFrameRef.current) {\n        cancelAnimationFrame(nextTurnFrameRef.current);\n      }\n\n      if (underlayFrameRef.current) {\n        cancelAnimationFrame(underlayFrameRef.current);\n      }\n\n      if (settleHoldTimeoutRef.current)'''
          )
          replace_exact(
              desktop,
              '''      targetIndex,\n      phase: "preparing",\n    });''',
              '''      targetIndex,\n      phase: "preparing",\n      underlayReady: false,\n    });'''
          )
          replace_exact(
              desktop,
              '''          return {\n            ...currentState,\n            phase: "turning",\n          };\n        });\n      });''',
              '''          return {\n            ...currentState,\n            phase: "turning",\n            underlayReady: false,\n          };\n        });\n\n        underlayFrameRef.current = requestAnimationFrame(() => {\n          setTurnState((currentState) => {\n            if (\n              !currentState ||\n              currentState.phase !== "turning"\n            ) {\n              return currentState;\n            }\n\n            return {\n              ...currentState,\n              underlayReady: true,\n            };\n          });\n        });\n      });'''
          )
          replace_exact(
              desktop,
              '''  if (turnState?.phase === "turning") {\n    if (turnState.direction === "next") {\n      visibleLeft = source.left;\n      visibleRight = target.right;\n    } else {\n      visibleLeft = target.left;\n      visibleRight = source.right;\n    }\n  }''',
              '''  if (turnState?.phase === "turning") {\n    if (!turnState.underlayReady) {\n      visibleLeft = source.left;\n      visibleRight = source.right;\n    } else if (turnState.direction === "next") {\n      visibleLeft = source.left;\n      visibleRight = target.right;\n    } else {\n      visibleLeft = target.left;\n      visibleRight = source.right;\n    }\n  }'''
          )

          # Video controls on mobile/tablet: hide WebKit's native play/pause overlays,
          # keep the native timeline, and make our own button visible above the timeline.
          for video_file in [
              "src/components/services/OrmedEquipmentSection.jsx",
              "src/components/services/OrmedKinezoSection.jsx",
          ]:
              replace_exact(
                  video_file,
                  '''    <div className="relative aspect-video overflow-hidden rounded-[17px] border border-[#d0a34a]/45 bg-[#020706] shadow-[0_18px_42px_rgba(0,0,0,0.36)] sm:rounded-[19px] lg:rounded-none lg:shadow-[0_18px_42px_rgba(0,0,0,0.32)]">\n      <video''',
                  '''    <div className="relative aspect-video overflow-hidden rounded-[17px] border border-[#d0a34a]/45 bg-[#020706] shadow-[0_18px_42px_rgba(0,0,0,0.36)] sm:rounded-[19px] lg:rounded-none lg:shadow-[0_18px_42px_rgba(0,0,0,0.32)]">\n      <style>{`\n        @media (max-width: 1023px) {\n          .ormed-native-controls-video::-webkit-media-controls-overlay-play-button,\n          .ormed-native-controls-video::-webkit-media-controls-start-playback-button,\n          .ormed-native-controls-video::-webkit-media-controls-play-button {\n            display: none !important;\n            -webkit-appearance: none !important;\n            opacity: 0 !important;\n            pointer-events: none !important;\n          }\n        }\n      `}</style>\n\n      <video'''
              )
              replace_exact(
                  video_file,
                  '''        className="absolute inset-0 h-full w-full object-cover"''',
                  '''        className="ormed-native-controls-video absolute inset-0 h-full w-full object-cover"'''
              )
              replace_exact(
                  video_file,
                  '''        <div className="absolute left-1/2 top-1/2 z-20 -translate-x-1/2 -translate-y-1/2">''',
                  '''        <div className="absolute left-1/2 top-[42%] z-20 -translate-x-1/2 -translate-y-1/2 sm:top-[43%] lg:top-1/2">'''
              )
              replace_exact(
                  video_file,
                  '''        <div className="absolute left-1/2 top-1/2 z-20 -translate-x-1/2 -translate-y-1/2 opacity-0 transition-opacity duration-300 hover:opacity-100">''',
                  '''        <div className="absolute left-1/2 top-[42%] z-20 -translate-x-1/2 -translate-y-1/2 opacity-100 transition-opacity duration-300 sm:top-[43%] lg:top-1/2 lg:opacity-0 lg:hover:opacity-100">'''
              )
              replace_exact(
                  video_file,
                  '''              icon={<PauseIcon />}\n              hiddenOnDesktopHover''',
                  '''              icon={<PauseIcon />}'''
              )

          # iOS/Safari-compatible copy fallback and legacy-password compatibility in 2FA settings.
          security = "src/components/profile/ProfileSecurityPanel.jsx"
          replace_exact(
              security,
              '''function SecurityStatus({ enabled, isAdmin }) {''',
              '''function copyTextWithSelection(value) {\n  if (typeof document === "undefined") {\n    return false;\n  }\n\n  const textarea = document.createElement("textarea");\n  textarea.value = value;\n  textarea.setAttribute("readonly", "");\n  textarea.setAttribute("aria-hidden", "true");\n  textarea.style.position = "fixed";\n  textarea.style.left = "-9999px";\n  textarea.style.top = "0";\n  textarea.style.opacity = "0";\n  textarea.style.pointerEvents = "none";\n\n  document.body.appendChild(textarea);\n  textarea.focus({ preventScroll: true });\n  textarea.select();\n  textarea.setSelectionRange(0, textarea.value.length);\n\n  let copied = false;\n\n  try {\n    copied = document.execCommand("copy");\n  } catch {\n    copied = false;\n  } finally {\n    textarea.remove();\n  }\n\n  return copied;\n}\n\nfunction SecurityStatus({ enabled, isAdmin }) {'''
          )
          replace_exact(
              security,
              '''    try {\n      await navigator.clipboard.writeText(value);\n      setSuccessMessage("Скопировано.");\n      setErrorMessage("");\n    } catch {\n      setErrorMessage("Не удалось скопировать. Скопируйте значение вручную.");\n    }''',
              '''    let copied = copyTextWithSelection(value);\n\n    if (!copied && navigator.clipboard?.writeText) {\n      try {\n        await navigator.clipboard.writeText(value);\n        copied = true;\n      } catch {\n        copied = false;\n      }\n    }\n\n    if (copied) {\n      setSuccessMessage("Скопировано.");\n      setErrorMessage("");\n      return;\n    }\n\n    setErrorMessage("Не удалось скопировать. Скопируйте значение вручную.");'''
          )
          replace_exact(
              security,
              '''            minLength={12}''',
              '''            minLength={8}''',
              count=2
          )

          # Legal page: keep the long Russian title inside narrow iPhone widths.
          legal = "src/components/legal/LegalPageLayout.jsx"
          replace_exact(
              legal,
              '''                <h1 className="m-0 text-3xl font-bold tracking-[-0.055em] text-[#f3d98d] sm:text-4xl lg:text-5xl">''',
              '''                <h1 className="m-0 min-w-0 max-w-full break-words text-[clamp(1.5rem,7vw,1.85rem)] font-bold leading-[1.08] tracking-[-0.055em] text-[#f3d98d] [overflow-wrap:anywhere] sm:text-4xl sm:leading-tight lg:text-5xl">'''
          )

          # Remove this temporary workflow in the same commit that applies the fixes.
          Path(".github/workflows/temp-apply-ui-fixes.yml").unlink()
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix responsive gallery and mobile controls"
          git push origin HEAD:fix/csp-local-auth
